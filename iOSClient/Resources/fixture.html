<body><h2>本地窗口 __SLOT__</h2><p>此页面仅验证布局、桥接和存储隔离</p><p id="storage"></p><p id="tick"></p>

<script>
localStorage.setItem('slot', '__SLOT__');
document.cookie='slot=__SLOT__;path=/';

</script></body></html>
