name: Build iPhone test app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        shell: bash
        run: |
          if [ -f Lanpangzi.xcodeproj/project.pbxproj ]; then
            echo 'IOS_PROJECT_DIR=.' >> "$GITHUB_ENV"
          elif [ -f iOSClient/Lanpangzi.xcodeproj/project.pbxproj ]; then
            echo 'IOS_PROJECT_DIR=iOSClient' >> "$GITHUB_ENV"
          else
            echo 'Xcode project missing' >&2
            exit 1
          fi
      - name: Check project and JavaScript
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          python3 tools/check_project.py
          node Tests/bridge.test.cjs
      - name: Select installed iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'simulators.json').read_text())['devices']
          phones = [d for runtime, entries in devices.items() if '.iOS-' in runtime
                    for d in entries if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No installed iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('IOS_SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Compile and run native tests
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: |
          xcodebuild -project Lanpangzi.xcodeproj -scheme Lanpangzi \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath build/Simulator -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned device IPA
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        run: bash tools/build_unsigned.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lanpangzi-unsigned-iphone-${{ github.run_number }}
          path: ${{ env.IOS_PROJECT_DIR }}/build/Lanpangzi-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results-${{ github.run_number }}
          path: ${{ env.IOS_PROJECT_DIR }}/build/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
